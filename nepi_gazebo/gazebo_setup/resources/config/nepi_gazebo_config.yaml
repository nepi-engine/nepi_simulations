# Control
# Set to 1 to request the action -- by the device, or by editing this file
# directly -- and cleared back to 0 by the SERVICE once it has carried out
# the action. Same convention nepi_docker.sh uses for its own request flags:
# do the work (reflected via GAZEBO_STATE while in flight), then zero the
# flag once the outcome is known. That clear-on-act is what keeps a request
# from re-firing on the next poll, so the flag is the whole request -- there
# is no companion timestamp to bump, and nothing else has to be edited for
# the service to notice. Watch GAZEBO_STATE for the outcome. If GAZEBO_START
# and GAZEBO_STOP are both 1 at once (e.g. both were set before the service
# cleared the first), GAZEBO_STOP wins.
# 1 = start requested.
GAZEBO_START: 0
# 1 = stop requested. Takes priority over GAZEBO_START if both are set.
GAZEBO_STOP: 0

# Selection
# CURRENT_* is what the simulation is actually using, and is written by the
# SERVICE -- treat it as read-only from the device side. To change one, put
# the new name in the matching UPDATE_* field: a non-empty UPDATE_* IS the
# request, the same way a 1 is the request for the flags above, so there is
# no separate "updating" flag that could fall out of step with it. The
# service validates the name, and only on success copies it into CURRENT_*;
# either way UPDATE_* is cleared back to "" once handled. A name that does
# not validate leaves CURRENT_* untouched and says why in GAZEBO_LAST_ERROR,
# so a typo can never leave the simulation pointed at something that isn't
# there.
#
# The .world file to launch, by filename, within the staged ENVIRONMENT
# folder (e.g. "iris_arducopter_cmac.world"). Valid = that file exists there.
# Empty means "no explicit choice": the service falls back to the first
# .world file in the folder and records what it picked here. Accepting a new
# value while Gazebo is running RESTARTS it against the new world, since a
# running gzserver cannot swap worlds in place.
GAZEBO_CURRENT_ENVIRONMENT: ""
GAZEBO_UPDATE_ENVIRONMENT: ""
# The Gazebo model to use, by directory name, within the staged SYSTEM
# folder (e.g. "generic_rover"). Valid = that directory exists there and
# contains a model.config. Recorded and validated only -- the whole SYSTEM
# folder is already on GAZEBO_MODEL_PATH, so naming a model here does not by
# itself change what the running simulation shows, and does not restart it.
GAZEBO_CURRENT_MODEL: ""
GAZEBO_UPDATE_MODEL: ""
# 1 = also run install_command before starting (or on its own, with
# start left at 0, to just pre-install without launching). Same
# clear-on-act convention as GAZEBO_START/GAZEBO_STOP above.
GAZEBO_INSTALL: 0
# Written by the VM-SIDE SERVICE. The device only ever READS this section
# (the same role status_<request_id>.json plays in the per-request-file
# protocol).
# Status
# idle | installing | starting | running | stopping | failed
GAZEBO_STATE: "idle"
# Empty when there is none.
GAZEBO_LAST_ERROR: ""
# PID of the running launch process, once state == "running" -- null/0
# otherwise. Lets the device show something concrete, not just "running".
GAZEBO_PID: 0
# Unix epoch seconds, updated by the service on every poll tick
# regardless of whether anything changed -- the device's equivalent of an
# SSH reachability probe or vm_command_watcher.py's own
# watcher_heartbeat.json: if this goes stale (much older than the
# service's poll interval), the device should treat this VM-side service
# as unreachable rather than trusting whatever GAZEBO_STATE last said.
GAZEBO_LAST_POLL: 0
