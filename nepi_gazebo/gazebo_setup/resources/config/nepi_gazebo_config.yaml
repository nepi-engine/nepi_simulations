# Control
# Set to 1 to request the action -- by the device, or by editing this file
# directly -- and cleared back to 0 by the SERVICE once it has carried out
# the action. Same convention nepi_docker.sh uses for its own request flags:
# do the work (reflected via GAZEBO_STATE while in flight), then zero the
# flag once the outcome is known. That clear-on-act is what keeps a request
# from re-firing on the next poll, so the flag is the whole request -- there
# is no companion timestamp to bump, and nothing else has to be edited for
# the service to notice. Watch GAZEBO_STATE for the outcome. If GAZEBO_START
# and GAZEBO_STOP are both 1 at once (e.g. both were set before the service
# cleared the first), GAZEBO_STOP wins.
# 1 = start requested. ALSO THE APPLY STEP: a start is what promotes staged
# selections (see the Selection section below) into CURRENT_*, then makes the
# world match them. That is why picking a new environment and a new robot and
# then asking to start lands as ONE restart carrying both, rather than as a
# restart per selection.
GAZEBO_START: 0
# 1 = stop requested. Takes priority over GAZEBO_START if both are set.
GAZEBO_STOP: 0

# Selection
# CURRENT_* is what the simulation is actually using, and is written by the
# SERVICE -- treat it as read-only from the device side.
#
# UPDATE_* is a STAGED selection: what the simulation will use once applied.
# Writing one is inert. The service validates it right away, so a typo is
# reported through GAZEBO_LAST_ERROR immediately (and the bad value is cleared,
# so it cannot sit pending and surprise a later apply), but a VALID staged
# value is left alone and the running simulation is not touched.
#
# GAZEBO_START is what applies them: it copies each staged value into its
# CURRENT_*, clears UPDATE_* back to "", and then brings the world into line.
# Staged values are re-validated at that moment, because these folders are
# synced from NEPI storage independently of this service and a config that was
# valid when staged can be gone by the time it is applied.
#
# Changed 2026-09-18. Previously a non-empty UPDATE_* WAS the request and was
# acted on at the next poll, which meant an operator browsing the environment
# dropdown restarted Gazebo on every pick, before deciding anything. Staging
# also lets robot and environment be chosen in either order and applied as one
# action. GAZEBO_STOP deliberately does not discard staged values: stopping is
# not a decision to throw away what was picked.
#
# The .world file to launch, by filename, within the staged
# ENVIRONMENT_CONFIGS folder (e.g. "iris_arducopter_cmac.world"). Valid =
# that file exists there. Empty means "no explicit choice": the service falls
# back to the first .world file in the folder and records what it picked
# here. Applying a new value while Gazebo is running RESTARTS it against the
# new world, since a running gzserver cannot swap worlds in place.
GAZEBO_CURRENT_ENVIRONMENT_CONFIG: ""
GAZEBO_UPDATE_ENVIRONMENT_CONFIG: ""
# The robot config to use, by directory name, within the staged ROBOT_CONFIGS
# folder (e.g. "generic_rover"). Valid = that directory exists there and
# contains BOTH a model.config and a model.sdf, since model.sdf is what gets
# spawned.
#
# The robot is a model spawned INTO the running world, not part of the .world
# file (those are scenery only). So unlike the environment pair above, changing
# this needs NO restart: the service deletes the outgoing robot and spawns the
# new one against the same running gzserver, which is near-instant. When Gazebo
# is not running the selection is simply recorded, and the next start spawns it.
#
# Staging both this and GAZEBO_UPDATE_ENVIRONMENT_CONFIG and then applying is
# handled as a single restart carrying the new robot, rather than a restart
# followed by a swap.
GAZEBO_CURRENT_ROBOT_CONFIG: ""
GAZEBO_UPDATE_ROBOT_CONFIG: ""
# GAZEBO_INSTALL was removed 2026-09-18 along with the whole install step. It
# had never worked: the service's INSTALL_SCRIPT pointed at an
# install_gazebo.sh that nothing in nepi_simulations ships, so every install
# request recorded "no install script at ..." and installed nothing. Gazebo
# dependencies are installed by nepi_gazebo_setup.sh instead, out of band from
# this file.
#
# Written by the VM-SIDE SERVICE. The device only ever READS this section
# (the same role status_<request_id>.json plays in the per-request-file
# protocol).
# Status
# idle | starting | running | stopping | failed
# ("installing" was also possible before the install step was removed
# 2026-09-18; the service still resets it to idle on startup so a config
# written by an older version cannot pin the state.)
GAZEBO_STATE: "idle"
# Empty when there is none.
GAZEBO_LAST_ERROR: ""
# PID of the running launch process, once state == "running" -- null/0
# otherwise. Lets the device show something concrete, not just "running".
GAZEBO_PID: 0
# Unix epoch seconds, updated by the service on every poll tick
# regardless of whether anything changed -- the device's equivalent of an
# SSH reachability probe or vm_command_watcher.py's own
# watcher_heartbeat.json: if this goes stale (much older than the
# service's poll interval), the device should treat this VM-side service
# as unreachable rather than trusting whatever GAZEBO_STATE last said.
GAZEBO_LAST_POLL: 0
