# Per-simulator launch targets for the additive auto-launch capability -- see
# docs/SIMULATOR_AUTO_LAUNCH_PLAN.md. Dev-only config: lives in nepi_drones,
# not nepi_apps, because a real deployed device never needs to know how to
# SSH into a dev VM to launch a simulator.
#
# No credentials here, ever. The SSH private key path comes from the
# NEPI_SSH_KEY environment variable at launch time (same convention every
# deploy_*.sh script in this repo already uses --
# NEPI_SSH_KEY=${NEPI_SSH_KEY:-~/.ssh/nepi_default_ssh_key}). host/user/port
# only below.
#
# Two independent network legs, confirmed separately (see
# MULTI_SIMULATOR_INTEGRATION_PLAN.md Phase 1's "Real-device confirmation"):
#   1. Bridge data path (VM's bridge script -> device's sim_connector_app_node.py
#      listen port, 9030 by default): often works with NO tunnel -- the sim VM
#      and the NEPI device just need to share a LAN, confirmed directly with
#      `cat < /dev/null > /dev/tcp/<device_host>/9030`. device_bridge_host
#      below is whatever address/hostname the VM can reach the device at.
#   2. Launcher SSH path (this NEPI device -> the sim VM, to actually run the
#      launch command): generally needs a reverse tunnel, since a NEPI device
#      is rarely on a routable network the dev VM can be dialed into and vice
#      versa isn't guaranteed either. host/ssh_port per launch target below
#      should point at whatever the device can reach -- a reverse-tunnel
#      loopback in the common case:
#        autossh -M 0 -f -N -R <ssh_port>:127.0.0.1:22 -p <device_ssh_port> \
#          -i ~/.ssh/nepi_default_ssh_key <device_user>@<device_host>
#      (run FROM the VM; sim_container/scripts/nepi_sitl_dev_env.sh's
#      nepi_tunnel() and its companion nepi-tunnel.service do exactly this,
#      already wired to every port this whole project uses). If your device
#      and VM already share a routable network, use the VM's real LAN
#      address instead and skip the tunnel.
#
# ssh_user below is "suraj" for every target -- one specific developer's own
# VM login, not a generic default. Rather than hand-editing all five blocks
# for a different deployment, set NEPI_SIM_VM_SSH_USER (and, if host/
# ssh_port also need to differ -- e.g. skipping the tunnel for a routable
# VM on port 22 -- NEPI_SIM_VM_HOST / NEPI_SIM_VM_SSH_PORT) wherever
# app_sim_connector actually runs (typically the device's own environment).
# See simulator_launcher.py's _apply_connection_env_overrides for exactly
# what these do, and docs/SIM_VM_CONNECTION_SETUP.md for the full
# two-machine setup walkthrough (both directions: this leg, and the
# device_bridge_host leg below).

# Path to the SSH private key -- a PATH only, never a key, and safe to
# commit. Needed because apps_mgr runs app nodes as root, so the launcher's
# ~/.ssh default would expand to /root/.ssh rather than the user's own
# .ssh where the key actually lives. NEPI_SSH_KEY still overrides this when
# set (e.g. running the launcher standalone as a normal user).
ssh_key_path: "/home/nepi/.ssh/nepi_default_ssh_key"

# Optional. A human-friendly name for the connection every target below
# hardcodes (host/ssh_user/ssh_port) -- shown as-is in the RUI's "OS"
# picker as the always-present, already-verified entry representing THIS
# yaml's own hardcoded machine (see os_instance_registry.py's
# ensure_baseline). If omitted, falls back to "ssh_user@host:port" -- still
# a real, identifying name, never a generic "Default" label.
# connection_display_name: "suraj-vm"

# How the VM-side bridge script reaches this NEPI device (leg 1 above).
# "nepi" here relies on the same /etc/hosts-style alias already used for SSH
# access to the device from the VM -- substitute your device's real
# hostname/IP if you don't have one.
device_bridge_host: "nepi"
device_bridge_port: 9030

# Every launch_command/attach_launch_command below sources
# scripts/nepi_sim_display_env.sh, which DETECTS and exports DISPLAY and
# XAUTHORITY. A non-interactive SSH session (no controlling tty, no login
# shell X11 setup) inherits neither on its own -- unlike nepi_sitl_dev_env.sh's
# own sitl_gazebo(), always run from an actual logged-in shell where both are
# already correct -- so something must set them, or gzclient and ArduCopter's
# xterm die instantly on "Invalid MIT-MAGIC-COOKIE-1 key" and the launch fails
# as a confusing "Timed out waiting for the simulator to become ready" with
# the sim half-up.
#
# These were hardcoded (`export DISPLAY=:N`) until 2026-08-12. Do NOT go back
# to that: the correct number is NOT stable across reboots on this VM. It was
# :1 on 2026-08-11 (gdm's greeter owned :0) and :0 after the next day's
# reboot, and hardcoding either value broke sim deployment on the day the
# other one became true -- twice in two days, the second time presenting as
# the ready-check timeout above. The helper probes candidates from `who` and
# /tmp/.X11-unix with xdpyinfo and picks one that actually authenticates, so a
# reboot that renumbers the session is a non-event. See that script's own
# header for the full detection order.
launch_targets:
  gazebo_rover:
    display_name: "Gazebo"
    host: "127.0.0.1"
    ssh_user: "suraj"
    ssh_port: 12222
    # Confirmed installed/working on the dev VM this was built against.
    # check_installed_command only checks for the two binaries the
    # launch_command below actually needs -- not a full ROS/Gazebo
    # environment audit -- since that's what "can this even attempt to
    # launch" means here.
    # ROS binaries live under /opt/ros/noetic, which is only on PATH after
    # sourcing setup.bash -- a plain `command -v gzserver` over a
    # non-interactive ssh session reported "not installed" despite gzserver
    # genuinely being present, for exactly that reason. Every other command
    # on this target already sources setup.bash first; this one just hadn't
    # caught up yet.
    # Prefixed (2026-08-28) with a check that nepi_drones itself is actually
    # checked out on the VM -- sim_container/'s world files, bridge scripts,
    # and listeners are what every launch_command below actually runs,
    # completely separately from whether Gazebo/ROS are installed. nepi_drones
    # is its OWN git repo, never a submodule of nepi_engine_ws, so deleting
    # and re-cloning nepi_engine_ws (a real, reported scenario: "i justget rid
    # of nepi_engine_ws due to some glitches and redownoaded it... it looks
    # like it cant properly connect to this vm") silently wipes it with no
    # warning. Without this check, a missing nepi_drones checkout still
    # passed as "installed" (gzserver/roscore were untouched), so Deploy
    # proceeded straight to launch_command, which failed referencing files
    # that no longer existed -- surfacing only as the generic, misleading
    # "Timed out waiting for the simulator to become ready", with nothing
    # pointing at the actual cause. Checked first (short-circuits before the
    # slower gzserver/roscore check) so this specific cause is what
    # not_installed/manual_fallback_commands actually reports.
    check_installed_command: "bash -lc \"test -d $HOME/nepi_engine_ws/nepi_drones/sim_container && source /opt/ros/noetic/setup.bash && command -v gzserver > /dev/null && command -v roscore > /dev/null\""
    # Widened (2026-08-26) from a bare `apt-get install ros-noetic-gazebo-*`
    # to a real fresh-Ubuntu-20.04 bootstrap: the old version silently assumed
    # ROS Noetic and the ROS apt repo/key were ALREADY present, so on a
    # genuinely fresh VM (no ROS at all) `ros-noetic-gazebo-ros-pkgs` couldn't
    # even be found and the whole install failed outright. The apt-repo/key/
    # ros-noetic-desktop-full steps are the same ones already proven in
    # nepi_setup/scripts/ros_setup.sh (written for the NEPI device's own
    # container, reused here verbatim for the sim VM's different purpose).
    # Each stage is skip-if-already-done so re-running this on a
    # partially-set-up box (ROS present but Gazebo missing, the common case)
    # is harmless and fast rather than redundantly reinstalling ROS itself.
    # Also clones nepi_drones itself if it's missing (2026-08-28, see the
    # check_installed_command comment above) -- best-effort: this needs the
    # VM to already have its own git/SSH access to this org's repos, which
    # a genuinely fresh VM may not, so a failure here still surfaces through
    # the app's normal install-failure reporting rather than silently
    # proceeding to a launch that can't work. manual_fallback_commands below
    # has the same clone as a copy-paste step for when it doesn't.
    install_command: >-
      bash -lc '
      set -e;
      if [ ! -d $HOME/nepi_engine_ws/nepi_drones/sim_container ]; then
      mkdir -p $HOME/nepi_engine_ws;
      git clone git@github.com:nepi-engine/nepi_drones.git $HOME/nepi_engine_ws/nepi_drones;
      fi;
      if [ ! -f /etc/apt/sources.list.d/ros-latest.list ]; then
      sudo sh -c "echo \"deb http://packages.ros.org/ros/ubuntu $(lsb_release -sc) main\" > /etc/apt/sources.list.d/ros-latest.list";
      sudo apt-get install -y curl;
      curl -s https://raw.githubusercontent.com/ros/rosdistro/master/ros.asc | sudo apt-key add -;
      fi;
      sudo apt-get update --fix-missing;
      if ! dpkg -s ros-noetic-desktop-full > /dev/null 2>&1; then
      sudo apt-get install -y ros-noetic-desktop-full;
      fi;
      sudo apt-get install -y ros-noetic-gazebo-ros-pkgs ros-noetic-gazebo-ros-control
      '
    # Copy of install_command's own steps, laid out one command per line for
    # the RUI to show verbatim as a copy-paste fallback if auto-install ever
    # fails (network blip, apt mirror down, etc.) -- see
    # sim_connector_app_node.py's runInstall/runLaunch and
    # Nepi_IF_SimLauncher.js's error_row rendering.
    manual_fallback_commands: |-
      git clone git@github.com:nepi-engine/nepi_drones.git ~/nepi_engine_ws/nepi_drones
      echo "deb http://packages.ros.org/ros/ubuntu $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/ros-latest.list
      sudo apt-get install -y curl
      curl -s https://raw.githubusercontent.com/ros/rosdistro/master/ros.asc | sudo apt-key add -
      sudo apt-get update --fix-missing
      sudo apt-get install -y ros-noetic-desktop-full
      sudo apt-get install -y ros-noetic-gazebo-ros-pkgs ros-noetic-gazebo-ros-control
    # Launches Gazebo (generic_rover.world) plus the RBX_SIM stack --
    # sim_heartbeat_listener.py (9022), camera_rig_controller.py and
    # sim_bridge_node.py (9023) -- i.e. exactly what sim_rover_gazebo() in
    # sim_rover_dev_env.sh starts.
    #
    # This used to launch sim_connector_bridge_gazebo.py (the app's own bridge
    # to sim_connector_app_node's port 9030) INSTEAD. That worked for the app's
    # own panel but meant the rover never appeared under Devices -> Robots at
    # all: that list is populated by RBX drivers, and rbx_sim_discovery.py finds
    # a robot ONLY by probing the heartbeat port (9022) and then holding the
    # bridge port (9023) -- neither of which anything was starting. So the sim
    # came up, drove fine on the VM, and was completely uncontrollable from the
    # RUI. Reported live 2026-08-12: "since nothing shows up in devices->robots,
    # i cant even control it. this is supposed to basically be doing the same as
    # summoning sim_rover_gazebo".
    #
    # The two bridges are swapped, NOT both started: they would fight over
    # /rover/cmd_vel (see MULTI_SIMULATOR_INTEGRATION_PLAN.md Phase 1's A/B
    # sanity note). Choosing the RBX_SIM one matches how this app is meant to
    # divide responsibility -- the sim connector picks the sim and robot config,
    # and Devices -> Robots does the actual controlling -- which is also why the
    # app's own manual robot controls were removed (see NepiAppSimConnector.js
    # show_controls). Consequence to know: the Sim Connector panel's own
    # bridge_connected/telemetry fields stay unset for this target, because
    # nothing is talking to port 9030 for it any more.
    # Every backgrounded process below redirects stdin from /dev/null as well
    # as stdout/stderr -- without it, the child keeps the ssh channel's stdin
    # pipe open and the ssh command that launched it never returns (learned
    # the hard way: a first attempt without "< /dev/null" hung until the
    # subprocess timeout killed it).
    # NOTE: every line in this folded (">-") block scalar must stay at the
    # SAME indentation -- YAML only folds newlines into spaces when
    # indentation is uniform; a deeper-indented continuation line is kept
    # literal (with its newline), which silently splits one intended
    # argument list across two bash statements. Learned the hard way: an
    # earlier draft indented wrapped lines two spaces deeper for
    # readability, which turned "nohup foo\n  --host x --port y &" into two
    # statements -- "nohup foo" (foreground, since the & landed on the
    # *next*, separate, argument-less statement) followed by a bogus
    # "--host x --port y" command -- and left bash blocked waiting on the
    # foreground child instead of returning. Given that fragility, every
    # line here is kept at the same indentation on purpose, folding to one
    # line -- verify with `yaml.safe_load(...)["launch_targets"]["gazebo_rover"]["launch_command"]`
    # before editing this block again.
    #
    # Also starts a local roscore first if one isn't already up -- gzserver's
    # ROS API plugin needs one to register with, and without it gzserver
    # just spins retrying "No ROS master" forever (learned by watching
    # /tmp/sim_connector_gazebo_launch.log after a launch that reported
    # "Ready: True" from a too-weak process-existence-only readiness check).
    # Matches the existing sim_rover_gazebo() convention in
    # sim_rover_dev_env.sh: `rostopic list` to detect, `until rostopic
    # list` to wait -- reused here rather than inventing a new check.
    #
    # Deliberately NOT detached with nohup+background-and-forget: closing
    # the ssh exec channel ends the remote login session, and on a
    # systemd-managed host that tears down (kills) every process still in
    # that session's cgroup regardless of nohup -- confirmed the hard way
    # (gzserver died with "XmlRpcClient::writeRequest: Connection refused"
    # seconds after a launch that had already returned "success"). The fix
    # mirrors sim_rover_gazebo()'s own model: keep the remote script running
    # in the foreground (ending in `wait $GZ_PID $BRIDGE_PID`) so the ssh
    # session's lifetime IS the sim's lifetime -- simulator_launcher.py
    # holds this ssh command open with Popen (not subprocess.run) instead of
    # a human keeping a terminal open.
    # A non-interactive ssh session inherits neither DISPLAY nor XAUTHORITY
    # from the target user's desktop session -- confirmed directly (`ssh ...
    # 'echo $DISPLAY $XAUTHORITY'` printed nothing) after gzserver kept
    # aborting with "Connection refused" despite roscore/session-lifetime
    # both being fine. gzclient needs both to attach to the desktop's actual
    # X server; ":0" and the gdm Xauthority path are this target's specific
    # single-display-desktop layout, not a generic default.
    # REFUSES TO START if any gzserver is already running, rather than
    # starting a second one. Two Gazebos cannot share the default gzserver
    # port (11345): the second one's gzserver silently fails to bind and dies,
    # while its gzclient happily attaches to the FIRST one's world. That
    # failure is invisible from the outside -- confirmed the hard way against
    # a live ArduPilot SITL session on the same VM, where this target reported
    # a fully successful launch (launcher_state "running", bridge_connected
    # true) while generic_rover.world had never loaded at all and
    # /rover/odom had "Publishers: None", the bridge merely having registered
    # itself as a subscriber. Failing loudly with a clear message is the only
    # honest outcome here; silently driving someone else's simulation is not.
    #
    # Writes its own process-group id to a pidfile so stop_command can kill
    # exactly this launch's processes -- see stop_command for why that matters.
    # $$ is the PGID because ssh starts this shell as a process-group leader,
    # and every child it spawns (the gazebo wrapper, gzserver, gzclient, the
    # bridge) inherits that same PGID -- verified with `ps -o pid,pgid`.
    #
    # The pkill for ai_targeting_controller_ardupilot.py is unconditional
    # cleanup, not specific to this target -- see gazebo_quadcopter's own
    # launch_command comment below for the full mechanism (a stray instance
    # left running from an unrelated manual SITL session reconnects to
    # whatever gzserver comes up next off the same persistent roscore and
    # silently re-adds its chair target, even to a plain rover world that
    # never asked for it).
    launch_command: >-
      bash -lc '
      source /opt/ros/noetic/setup.bash;
      . $HOME/nepi_engine_ws/nepi_drones/sim_container/scripts/nepi_sim_display_env.sh;
      export GAZEBO_MODEL_PATH=$HOME/nepi_engine_ws/nepi_drones/sim_container/models:$GAZEBO_MODEL_PATH;
      if pgrep -x gzserver > /dev/null; then echo "REFUSING TO LAUNCH: a gzserver is already running on this host. Gazebo instances collide on port 11345 -- a second one would silently attach to the running world instead of loading generic_rover.world. Stop the existing simulation first." >&2; exit 3; fi;
      pkill -f "[a]i_targeting_controller_ardupilot.py" 2>/dev/null;
      echo $$ > /tmp/sim_connector_launch.pgid;
      rostopic list > /dev/null 2>&1 || {{ nohup roscore < /dev/null > /tmp/sim_connector_roscore_launch.log 2>&1 & until rostopic list > /dev/null 2>&1; do sleep 1; done; }};
      rosrun gazebo_ros gazebo $HOME/nepi_engine_ws/nepi_drones/sim_container/worlds/generic_rover.world < /dev/null > /tmp/sim_connector_gazebo_launch.log 2>&1 & GZ_PID=$!;
      sleep 8;
      python3 -u $HOME/nepi_engine_ws/nepi_drones/sim_container/scripts/sim_heartbeat_listener.py 9022 < /dev/null > /tmp/sim_heartbeat_listener.log 2>&1 & HB_PID=$!;
      python3 -u $HOME/nepi_engine_ws/nepi_drones/sim_container/scripts/camera_rig_controller.py < /dev/null > /tmp/camera_rig_controller.log 2>&1 & CAM_PID=$!;
      python3 $HOME/nepi_engine_ws/nepi_drones/sim_container/scripts/sim_bridge_node.py < /dev/null > /tmp/sim_bridge_node.log 2>&1 & BRIDGE_PID=$!;
      wait $GZ_PID $HB_PID $CAM_PID $BRIDGE_PID
      '
    # Used instead of launch_command when the operator explicitly chose
    # "Use Existing" after hitting launch_command's own refuse-to-launch
    # guard above -- an explicit, deliberate override of that guard, not a
    # way around it. Skips the refuse check AND the `rosrun gazebo_ros
    # gazebo ...` line entirely (assumes a gazebo the operator already
    # knows about is up), then does everything else identically: roscore
    # check, bridge launch, same pgid tracking. Two honest consequences of
    # skipping the world-launch line, both intentional, not bugs:
    #   - stop_command's pgid-kill naturally never reaches the pre-existing
    #     gzserver either, since it was never part of THIS launch's process
    #     group -- attaching never risks killing something this app didn't
    #     start, with no special-casing needed.
    #   - ready_check_command below still verifies generic_rover.world
    #     specifically is what's loaded -- if the pre-existing gazebo has
    #     the WRONG world up, this reports a clean "failed to become ready"
    #     rather than a false success, exactly like a real launch would.
    attach_launch_command: >-
      bash -lc '
      source /opt/ros/noetic/setup.bash;
      . $HOME/nepi_engine_ws/nepi_drones/sim_container/scripts/nepi_sim_display_env.sh;
      export GAZEBO_MODEL_PATH=$HOME/nepi_engine_ws/nepi_drones/sim_container/models:$GAZEBO_MODEL_PATH;
      pkill -f "[a]i_targeting_controller_ardupilot.py" 2>/dev/null;
      echo $$ > /tmp/sim_connector_launch.pgid;
      rostopic list > /dev/null 2>&1 || {{ nohup roscore < /dev/null > /tmp/sim_connector_roscore_launch.log 2>&1 & until rostopic list > /dev/null 2>&1; do sleep 1; done; }};
      python3 -u $HOME/nepi_engine_ws/nepi_drones/sim_container/scripts/sim_heartbeat_listener.py 9022 < /dev/null > /tmp/sim_heartbeat_listener.log 2>&1 & HB_PID=$!;
      python3 -u $HOME/nepi_engine_ws/nepi_drones/sim_container/scripts/camera_rig_controller.py < /dev/null > /tmp/camera_rig_controller.log 2>&1 & CAM_PID=$!;
      python3 $HOME/nepi_engine_ws/nepi_drones/sim_container/scripts/sim_bridge_node.py < /dev/null > /tmp/sim_bridge_node.log 2>&1 & BRIDGE_PID=$!;
      wait $HB_PID $CAM_PID $BRIDGE_PID
      '
    # Kills this launch's own process group PLUS an explicit, scoped
    # gzserver/gzclient pkill -- the pgid kill alone is NOT sufficient,
    # confirmed live (2026-09-08) with `ps -eo pid,ppid,pgid,sid,cmd`: `rosrun
    # gazebo_ros gazebo` execs /opt/ros/noetic/lib/gazebo_ros/gazebo, a shell
    # wrapper that starts gzserver/gzclient in a NEW session (their sid/pgid
    # matched each other but NOT the launching bash -l script's own tracked
    # pgid, and their ppid pointed at an unrelated ancestor, not this
    # script). The user hit this directly: Stop appeared to work (it clears
    # the RUI/robots list and removes its own pgid file), but gzserver/
    # gzclient kept running, so the next launch's own `pgrep -x gzserver`
    # guard refused every subsequent Deploy click with "already running"
    # until the orphan was killed by hand. An earlier version of this command
    # ran unscoped `pkill -x gzserver; pkill -x gzclient`, removed because it
    # would tear down an unrelated Gazebo (e.g. a live ArduPilot SITL session
    # on the same host) too -- kept scoped THIS time: gzserver is matched by
    # this target's own world file (so a different target's/an unrelated
    # manual Gazebo's gzserver, running a different world, survives), while
    # gzclient is killed unscoped, same tradeoff kill_all_gazebo's own
    # docstring already accepts -- there is realistically only ever one
    # gzclient paired with whichever one gzserver the launch guard already
    # limits the host to.
    #
    # Does not touch roscore: if launch_command found one already running,
    # it isn't ours to kill; if launch_command started its own, it is in
    # this same process group and so goes down with the pgid kill.
    #
    # "[s]im_connector_bridge_gazebo.py" (not "sim_connector_bridge_gazebo.py")
    # is deliberate, not a typo -- found while debugging gazebo_quadcopter's
    # own stop_command below: a plain `pkill -f pattern` always self-matches
    # this SAME bash -lc invocation (its own argv literally contains the
    # pattern text), killing this script before the trailing `; true` even
    # runs. Same reasoning applied to the new gzserver pkill below
    # ("[g]zserver", not "gzserver").
    stop_command: "bash -lc 'f=/tmp/sim_connector_launch.pgid; if [ -f $f ]; then kill -- -$(cat $f) 2>/dev/null; rm -f $f; fi; pkill -f [s]im_bridge_node.py 2>/dev/null; pkill -f [s]im_heartbeat_listener.py 2>/dev/null; pkill -f [c]amera_rig_controller.py 2>/dev/null; pkill -f \"[g]zserver .*generic_rover\\.world\" 2>/dev/null; pkill -x gzclient 2>/dev/null; true'"
    # Verifies THIS target's own world is up, not just that some gazebo is.
    # Two earlier versions were both false-positive-prone: process existence
    # alone missed gzserver spinning on "No ROS master", and a bare
    # `rostopic list | grep '^/gazebo'` passed off another world's gazebo
    # topics as success (see launch_command's note). Matching the world file
    # in gzserver's own command line is what ties readiness to this target,
    # and /rover/odom having a real publisher is what proves the rover model
    # actually loaded rather than the bridge merely having subscribed.
    ready_check_command: "bash -lc \"source /opt/ros/noetic/setup.bash; pgrep -f 'gzserver.*generic_rover.world' > /dev/null && pgrep -f sim_bridge_node.py > /dev/null && pgrep -f sim_heartbeat_listener.py > /dev/null && rostopic info /rover/odom 2>/dev/null | grep -A1 '^Publishers:' | grep -q ' \\* /'\""
    # Which sim_connector_app_params.yaml robot_configs entry this target's
    # bridge expects -- auto-selected on successful launch.
    #
    # ground_robot_4_wheel, not ground_robot_2_wheel: generic_rover.world's
    # only rover model (models/generic_rover) has FOUR wheels --
    # front_left/front_right/rear_left/rear_right. Defaulting to the 2-wheel
    # entry meant picking "2-wheel rover" and being handed the 4-wheel robot,
    # reported live 2026-08-12 ("deploying the 2-wheel rover + gazebo actually
    # deploys the 4 wheel rover instead").
    #
    # NOTE: a robot_configs entry only describes the CONTROL SURFACE the app
    # and RUI expose (wheel/motor counts, which axes exist) -- it does not
    # choose the Gazebo model. So selecting ground_robot_2_wheel cannot make
    # this world spawn a two-wheeled robot; there is no 2-wheel model in
    # models/ to spawn. Genuinely supporting a 2-wheel rover means authoring
    # that model plus a world for it and giving it its own launch target, not
    # changing this line.
    default_robot_config: ground_robot_4_wheel
    # This target's own rover world/bridge has no way to serve a 4-motor
    # flight profile (no altitude axis, no flight controller) -- redirect
    # the ACTUAL launch to gazebo_quadcopter below instead, a different
    # world (iris_arducopter_cmac.world), bridge (MAVLink, not the JSON
    # Twist-mixer protocol), and install requirement (ArduCopter SITL)
    # entirely. "Gazebo" stays the one thing picked in the Simulator
    # selector -- see resolve_launch_target's docstring in
    # simulator_launcher.py for why this is the mirror image of
    # robot_config_overrides above (target-for-config instead of
    # config-for-target).
    launch_target_overrides:
      flight_robot_4_motor: gazebo_quadcopter

  # Reached only through gazebo_rover's own launch_target_overrides above --
  # never offered directly in the Simulator selector (hidden_from_selector,
  # the same flag/meaning a robot_configs entry uses). Gazebo + ArduCopter
  # SITL, linked through the iris_with_ardupilot model's own ArduPilotPlugin
  # FDM socket (built into ardupilot_gazebo, not something this launch
  # orchestrates itself) -- confirmed working for the separate RBX ArduPilot
  # SITL dev flow this reuses the world/camera-rig pieces from (see
  # nepi_sitl_dev_env.sh's sitl_gazebo_full). Runs its OWN ArduCopter SITL
  # instance on a dedicated MAVLink port (5772) distinct from that other
  # flow's mavros port (5771), so the two can coexist -- but only one
  # gzserver/one ArduCopter SITL process can run at a time regardless (see
  # launch_command's own refuse-to-launch guards), so running this AND the
  # separate RBX SITL dev flow simultaneously is not supported.
  gazebo_quadcopter:
    display_name: "Gazebo (Quadcopter/ArduCopter SITL)"
    hidden_from_selector: true
    host: "127.0.0.1"
    ssh_user: "suraj"
    ssh_port: 12222
    # Checks for ArduCopter SITL + pymavlink + the ardupilot_gazebo world
    # file, IN ADDITION to the plain gzserver/roscore check gazebo_rover's
    # own command uses -- this target needs all of it, not just Gazebo
    # itself. nepi_drones existence checked first, same as gazebo_rover --
    # see that target's own check_installed_command comment for the full
    # "nepi_drones deleted and re-cloned nepi_engine_ws only" scenario this
    # catches.
    #
    # Also checks for gz_reset_listener.py and sim_launch_listener.py under
    # ~/.local/bin -- both scripts' own docstrings say they're "installed to
    # ~/.local/bin" on the dev VM, but that has only ever been a comment,
    # never an automated step (no install_command/manual_fallback_commands
    # entry here ever copied them there). Found live 2026-09-14 on this exact
    # dev VM: neither file actually existed at that path, so the
    # launch_command's own `nohup python3 -u $HOME/.local/bin/
    # gz_reset_listener.py ...` line failed with a plain "No such file or
    # directory" into a background log nobody was watching -- RESET_SIM's
    # socket connect then failed silently every time, so only the
    # force-disarm half of reset_sim() ever ran; the Gazebo pose reset half
    # never did. Checking for both here surfaces that as a normal
    # "Simulator Not Installed" state instead of a RESET_SIM command that
    # quietly does half of what it claims.
    check_installed_command: "bash -lc \"test -d $HOME/nepi_engine_ws/nepi_drones/sim_container && source /opt/ros/noetic/setup.bash && command -v gzserver > /dev/null && command -v roscore > /dev/null && command -v sim_vehicle.py > /dev/null && python3 -c 'import pymavlink' > /dev/null 2>&1 && test -f $HOME/ardupilot_gazebo/worlds/iris_arducopter_cmac.world && test -f $HOME/.local/bin/gz_reset_listener.py && test -f $HOME/.local/bin/sim_launch_listener.py\""
    # Added (2026-09-02) -- until now this target had no install_command at
    # all (unlike every other target) because ArduPilot SITL setup is a
    # multi-step build from source with no honest single package-manager
    # command. Reported live: the RUI's Install button hit "Install command
    # exited 1: sudo: a terminal is required to read the password" on every
    # target (a foundational bug, fixed separately -- see simulator_launcher.py's
    # SUDO_NOPASSWD_FALLBACK_COMMANDS), and separately this target's own
    # manual_fallback_commands below was missing Gazebo11, the
    # ardupilot_gazebo bridge plugin, and the world file entirely, and built
    # ArduPilot off `master` -- which doesn't build against Ubuntu 20.04's
    # stock Python 3.8.10. Reported live: "these gazebo comamnds are also
    # missing making it useable with pyhon 3.8.10, since thats the max
    # ubuntu 20.04 can go to." Fixed by pinning `Copter-4.5` (the last
    # release branch confirmed Python-3.8-compatible) and adding the missing
    # Gazebo11 + bridge-plugin + world-file steps below, using the same
    # validated command sequence the user's own manual recipe confirmed
    # works. Every stage is skip-if-already-done, same convention as
    # gazebo_rover's own install_command, so re-running this on a
    # partially-set-up box (e.g. ArduPilot built but the bridge plugin
    # missing) is harmless and fast rather than redundantly rebuilding
    # everything. The world-file copy at the end is NOT skip-if-already-done
    # on purpose -- it always overwrites from nepi_drones' own committed copy,
    # since that repo (not the target machine) is this file's source of
    # truth. NOT live-tested against real Gazebo/compute hardware as of
    # 2026-09-02 -- code-reviewed against the user's own validated manual
    # recipe and the stock khancyr/ardupilot_gazebo world file, ships the
    # same "VM-side done, on-device confirmation still open" way this
    # project already documents elsewhere (see SIM_OS_INSTANCES_PLAN.md's
    # own dated entries). INSTALL_TIMEOUT_SEC was raised from 600s to 3600s
    # in simulator_launcher.py alongside this -- a full ArduPilot build plus
    # ros-noetic-desktop-full plus the bridge's cmake build can easily run
    # past 10 minutes on modest hardware.
    #
    # ArduPilot clone made shallow + single-branch (2026-09-03) -- confirmed
    # live: a plain `git clone --recurse-submodules` (full history, every
    # branch) took well over half an hour and was still only partway through
    # on a real network connection, since ArduPilot's own repo history plus
    # its full submodule set is large. `--branch Copter-4.5 --depth 1
    # --shallow-submodules` clones only the one commit this target actually
    # builds (and only its submodules at that same depth), which is all
    # `./waf` needs -- dramatically smaller and faster, no loss of
    # functionality (nothing here ever needs this repo's git history).
    #
    # PIP_CONSTRAINT added (2026-09-03) -- confirmed live: with the clone
    # fix above actually working, install-prereqs-ubuntu.sh itself then
    # failed (exit 2) inside its own `pip3 install --user -U pip setuptools
    # wheel` step's LATER pip invocation, with `packaging.version.
    # InvalidVersion: Invalid version: '1.0.3.linux-x86_64'` -- a legacy,
    # non-PEP440 version string somewhere in a dependency's PyPI release
    # history that newer setuptools' own VENDORED `packaging` (22+, which
    # dropped the old lenient LegacyVersion fallback in favor of raising)
    # can no longer parse. Confirmed live: pinning `pip<24`/`setuptools<66`
    # via PIP_CONSTRAINT before running install-prereqs-ubuntu.sh (whose
    # own unconditional `-U` would otherwise install the newest, broken
    # combination) lets the exact same prereqs install succeed cleanly --
    # setuptools<66 still vendors the pre-strict packaging that falls back
    # instead of raising. Nothing this script installs afterward needs a
    # newer pip/setuptools than this.
    install_command: >-
      bash -lc '
      set -e;
      if [ ! -d $HOME/nepi_engine_ws/nepi_drones/sim_container ]; then
      mkdir -p $HOME/nepi_engine_ws;
      git clone git@github.com:nepi-engine/nepi_drones.git $HOME/nepi_engine_ws/nepi_drones;
      fi;
      if [ ! -f /etc/apt/sources.list.d/ros-latest.list ]; then
      sudo sh -c "echo \"deb http://packages.ros.org/ros/ubuntu $(lsb_release -sc) main\" > /etc/apt/sources.list.d/ros-latest.list";
      sudo apt-get install -y curl;
      curl -s https://raw.githubusercontent.com/ros/rosdistro/master/ros.asc | sudo apt-key add -;
      fi;
      sudo apt-get update --fix-missing;
      if ! dpkg -s ros-noetic-desktop-full > /dev/null 2>&1; then
      sudo apt-get install -y ros-noetic-desktop-full;
      fi;
      sudo apt-get install -y ros-noetic-gazebo-ros-pkgs ros-noetic-gazebo-ros-control;
      if [ ! -f /etc/apt/sources.list.d/gazebo-stable.list ]; then
      sudo apt-get install -y wget lsb-release gnupg;
      sudo sh -c "echo \"deb http://packages.osrfoundation.org/gazebo/ubuntu-stable $(lsb_release -sc) main\" > /etc/apt/sources.list.d/gazebo-stable.list";
      wget -q https://packages.osrfoundation.org/gazebo.key -O - | sudo apt-key add -;
      sudo apt-get update;
      fi;
      sudo apt-get install -y gazebo11 libgazebo11-dev;
      if [ ! -d $HOME/ardupilot ]; then
      git clone --branch Copter-4.5 --depth 1 --recurse-submodules --shallow-submodules https://github.com/ArduPilot/ardupilot $HOME/ardupilot;
      fi;
      cd $HOME/ardupilot;
      git checkout Copter-4.5;
      git submodule update --init --recursive;
      if [ ! -x $HOME/ardupilot/build/sitl/bin/arducopter ]; then
      echo "pip<24" > /tmp/nepi_pip_constraints.txt;
      echo "setuptools<66" >> /tmp/nepi_pip_constraints.txt;
      export PIP_CONSTRAINT=/tmp/nepi_pip_constraints.txt;
      Tools/environment_install/install-prereqs-ubuntu.sh -y;
      . $HOME/.profile;
      ./waf configure --board sitl;
      ./waf copter;
      fi;
      if [ ! -d $HOME/ardupilot_gazebo ]; then
      git clone https://github.com/khancyr/ardupilot_gazebo $HOME/ardupilot_gazebo;
      fi;
      mkdir -p $HOME/ardupilot_gazebo/build;
      cd $HOME/ardupilot_gazebo/build;
      cmake ..;
      make -j$(nproc);
      sudo make install;
      mkdir -p $HOME/ardupilot_gazebo/worlds;
      cp -f $HOME/nepi_engine_ws/nepi_drones/sim_container/worlds/iris_arducopter_cmac.world $HOME/ardupilot_gazebo/worlds/iris_arducopter_cmac.world;
      mkdir -p $HOME/.local/bin;
      cp -f $HOME/nepi_engine_ws/nepi_drones/sim_container/scripts/gz_reset_listener.py $HOME/.local/bin/gz_reset_listener.py;
      cp -f $HOME/nepi_engine_ws/nepi_drones/sim_container/scripts/sim_launch_listener.py $HOME/.local/bin/sim_launch_listener.py;
      chmod +x $HOME/.local/bin/gz_reset_listener.py $HOME/.local/bin/sim_launch_listener.py
      '
    # Copy of install_command's own steps, laid out one command per line for
    # the RUI to show verbatim as a copy-paste fallback if auto-install ever
    # fails -- same convention as gazebo_rover's own manual_fallback_commands.
    manual_fallback_commands: |-
      git clone git@github.com:nepi-engine/nepi_drones.git ~/nepi_engine_ws/nepi_drones
      git clone --branch Copter-4.5 --depth 1 --recurse-submodules --shallow-submodules https://github.com/ArduPilot/ardupilot
      cd ardupilot
      git checkout Copter-4.5
      git submodule update --init --recursive
      echo "pip<24" > /tmp/nepi_pip_constraints.txt
      echo "setuptools<66" >> /tmp/nepi_pip_constraints.txt
      export PIP_CONSTRAINT=/tmp/nepi_pip_constraints.txt
      Tools/environment_install/install-prereqs-ubuntu.sh -y
      . ~/.profile
      ./waf configure --board sitl
      ./waf copter
      echo "deb http://packages.osrfoundation.org/gazebo/ubuntu-stable $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/gazebo-stable.list
      wget -q https://packages.osrfoundation.org/gazebo.key -O - | sudo apt-key add -
      sudo apt-get update
      sudo apt-get install -y gazebo11 libgazebo11-dev
      cd ~
      git clone https://github.com/khancyr/ardupilot_gazebo
      mkdir -p ardupilot_gazebo/build
      cd ardupilot_gazebo/build
      cmake ..
      make -j$(nproc)
      sudo make install
      mkdir -p ~/ardupilot_gazebo/worlds
      cp ~/nepi_engine_ws/nepi_drones/sim_container/worlds/iris_arducopter_cmac.world ~/ardupilot_gazebo/worlds/
      mkdir -p ~/.local/bin
      cp ~/nepi_engine_ws/nepi_drones/sim_container/scripts/gz_reset_listener.py ~/.local/bin/
      cp ~/nepi_engine_ws/nepi_drones/sim_container/scripts/sim_launch_listener.py ~/.local/bin/
      chmod +x ~/.local/bin/gz_reset_listener.py ~/.local/bin/sim_launch_listener.py
    # Same fragile-YAML-folding caution as gazebo_rover's own launch_command
    # above applies here verbatim -- every line stays at the SAME
    # indentation on purpose. Verify with
    # `yaml.safe_load(...)["launch_targets"]["gazebo_quadcopter"]["launch_command"]`
    # before editing this block again.
    #
    # Refuses if EITHER a gzserver OR an ArduCopter SITL instance is already
    # running -- the second guard matters here specifically because the
    # separate RBX ArduPilot SITL dev flow (nepi_sitl_dev_env.sh) can leave
    # one running on this same VM, and two ArduCopter instances cannot share
    # the default MAVLink ports any more than two gzservers can share 11345.
    #
    # The ArduCopter guard checks port 5760 (SITL's own primary/default
    # MAVLink port, opened by any ArduCopter instance regardless of this
    # target's own extra --out port) rather than `pgrep -f` against the
    # process's command line -- confirmed the hard way that a `pgrep -f`
    # check HERE always matches, including the classic bracket-class
    # self-match workaround (`"[s]im_vehicle.py..."`): `bash -c "<this whole
    # multi-line script>"` shows its OWN cmdline, via ps/pgrep, as the
    # ENTIRE script text for as long as it runs -- and that text contains
    # the literal substring "sim_vehicle.py -v ArduCopter" later on, in the
    # real launch line below. No `pgrep -f` pattern naming that program can
    # ever avoid matching this script's own in-flight invocation, since the
    # match comes from a DIFFERENT part of the same running script, not from
    # the checking command's own argv (which is the case the bracket trick
    # actually fixes). A port-liveness probe has no such problem: it reads
    # the kernel's own listening-socket table, never this process's argv.
    # gzserver's own guard above doesn't have this problem either way:
    # `pgrep -x` matches the process NAME only ("bash", never "gzserver").
    #
    # ai_targeting_controller_ardupilot.py now launched alongside too
    # (2026-09-03) -- reported live: "look over the drone autonomous script
    # pipeline (the simulator object detection) and see if that's working
    # properly." Investigation found a real integration gap: this target's
    # own guard already did `pkill -f "[a]i_targeting_controller_ardupilot.py"`
    # (cleaning up a stray instance from the older nepi_sitl_dev_env.sh dev
    # workflow) but never started a fresh one -- the chair-following demo's
    # actual detection source only ever came up through that separate,
    # older workflow (source nepi_sitl_dev_env.sh && sitl_gazebo_full, or
    # sim_launch_listener.py's remote trigger, which itself only exists if
    # sitl_gazebo/sitl_gazebo_full already ran once), never through this
    # Deploy button. A Deploy alone produced a flying drone with nothing to
    # detect. Now started here directly, same pattern as camera_rig_
    # controller_ardupilot.py right above it -- Deploy is self-sufficient
    # for the whole chair-following demo now, matching gazebo_rover's own
    # launch_command already bundling its own auxiliary processes together.
    #
    # camera_rig_controller_ardupilot.py is launched alongside (not by the
    # bridge script itself) -- it already owns positioning/publishing the
    # chase-cam feed for the separate RBX SITL dev flow; reused here as-is
    # rather than re-deriving the same follow-camera math a second time,
    # see sim_connector_bridge_gazebo_quadcopter.py's own module docstring.
    #
    # sim_vehicle.py's own --out=tcpin:0.0.0.0:5772 gives this bridge a
    # DEDICATED MAVLink port, the same reasoning nepi_sitl_dev_env.sh's own
    # --out=tcpin:0.0.0.0:5771 uses for mavros -- without it, sim_vehicle.py's
    # own MAVProxy would be the SITL's only MAVLink client and this bridge
    # could never connect.
    #
    # MAVProxy MUST get --mavproxy-args="--daemon". Without it, MAVProxy's
    # main loop calls input_loop(), which blocks reading stdin; with no
    # controlling terminal (this is a detached ssh exec channel) stdin is at
    # EOF immediately, MAVProxy treats that as "user quit" and runs its full
    # unload-every-module-and-exit sequence, sim_vehicle.py then kills the
    # ArduCopter binary, and the launch script's `wait` returns -- taking
    # gzserver down with the process group. The whole simulation collapses
    # seconds to minutes after a launch that reported success.
    #
    # This block previously tried to solve the same problem with a FIFO held
    # open read-write on fd 3, so MAVProxy's stdin would never signal EOF.
    # That did not hold: captured live 2026-08-12, MAVProxy still died with
    # "raise EOFError / EOFError" in its own log followed by
    # "Unloading module ..." for every module, and gzserver logged
    # "Terminated". --daemon skips input_loop() entirely (the status loop just
    # sleeps), so there is no stdin to lose in the first place -- which is why
    # nepi_sitl_dev_env.sh's own sitl_gazebo_full() already passes it for its
    # nohup'd headless launch and calls it "required, not optional". Same
    # reasoning applies verbatim here; stdin is plain /dev/null now.
    # The gz_reset_listener guard below is bracket-escaped ("[g]z_reset_..."),
    # not "gz_reset_listener.py 9021" plain -- found live (2026-08-19) as the
    # reason RESET_SIM had silently stopped working: this whole launch_command
    # runs as ONE long-lived `bash -lc '...'` process (it stays alive doing
    # `wait $SITL_PID ...` at the bottom), and its own command line contains
    # this exact literal text. A plain `pgrep -f "gz_reset_listener.py 9021"`
    # matches THAT PARENT PROCESS's own command line immediately, every time,
    # before the nohup'd listener is ever started -- so the `||` branch never
    # ran and no listener was ever actually launched, while every future check
    # kept reporting (falsely) that one already was. RESET_SIM's setup action
    # (rbx_ardupilot_node.py's resetSimAction) then simply had nothing on
    # port 9021 to connect to and failed silently. Same self-match class as
    # the ai_targeting_controller_ardupilot.py pkill guard just above, which
    # was already bracket-escaped for the same reason.
    launch_command: >-
      bash -lc '
      source /opt/ros/noetic/setup.bash;
      . $HOME/nepi_engine_ws/nepi_drones/sim_container/scripts/nepi_sim_display_env.sh;
      export GAZEBO_MODEL_PATH=$HOME/nepi_engine_ws/nepi_drones/sim_container/models:$HOME/ardupilot_gazebo/models:$GAZEBO_MODEL_PATH;
      if pgrep -x gzserver > /dev/null; then echo "REFUSING TO LAUNCH: a gzserver is already running on this host. A second one would silently attach to the running world instead of loading iris_arducopter_cmac.world. Stop the existing simulation first." >&2; exit 3; fi;
      if timeout 1 bash -c "cat < /dev/null > /dev/tcp/127.0.0.1/5760" 2>/dev/null; then echo "REFUSING TO LAUNCH: ArduCopter SITL already appears to be running on this host (port 5760 is taken -- possibly the separate RBX ArduPilot SITL dev flow, see nepi_sitl_dev_env.sh). Only one instance can own the default MAVLink ports at a time. Stop it first." >&2; exit 3; fi;
      pkill -f "[a]i_targeting_controller_ardupilot.py" 2>/dev/null;
      echo $$ > /tmp/sim_connector_quadcopter_launch.pgid;
      rostopic list > /dev/null 2>&1 || {{ nohup roscore < /dev/null > /tmp/sim_connector_quadcopter_roscore_launch.log 2>&1 & until rostopic list > /dev/null 2>&1; do sleep 1; done; }};
      pgrep -f "[g]z_reset_listener.py 9021" > /dev/null || {{ nohup python3 -u $HOME/.local/bin/gz_reset_listener.py 9021 < /dev/null > /tmp/sim_connector_quadcopter_gz_reset_listener_launch.log 2>&1 & disown; }};
      sim_vehicle.py -v ArduCopter -f gazebo-iris --out=tcpin:0.0.0.0:5771 --out=tcpin:0.0.0.0:5772 --mavproxy-args="--daemon" < /dev/null > /tmp/sim_connector_quadcopter_sitl_launch.log 2>&1 & SITL_PID=$!;
      rosrun gazebo_ros gazebo $HOME/ardupilot_gazebo/worlds/iris_arducopter_cmac.world < /dev/null > /tmp/sim_connector_quadcopter_gazebo_launch.log 2>&1 & GZ_PID=$!;
      gz_wait=0; until rostopic list 2>/dev/null | grep -q "^/gazebo/model_states$"; do sleep 1; gz_wait=$((gz_wait+1)); if [ $gz_wait -ge 30 ]; then break; fi; done;
      python3 $HOME/nepi_engine_ws/nepi_drones/sim_container/scripts/camera_rig_controller_ardupilot.py < /dev/null > /tmp/sim_connector_quadcopter_camera_rig_launch.log 2>&1 & CAM_PID=$!;
      python3 $HOME/nepi_engine_ws/nepi_drones/sim_container/scripts/ai_targeting_controller_ardupilot.py < /dev/null > /tmp/sim_connector_quadcopter_ai_targeting_launch.log 2>&1 & AI_TARGET_PID=$!;
      python3 $HOME/nepi_engine_ws/nepi_drones/sim_container/bridges/gazebo/sim_connector_bridge_gazebo_quadcopter.py --host {device_bridge_host} --port {device_bridge_port} --mavlink tcp:127.0.0.1:5772 < /dev/null > /tmp/sim_connector_quadcopter_bridge_launch.log 2>&1 & BRIDGE_PID=$!;
      python3 $HOME/nepi_engine_ws/nepi_drones/sim_container/scripts/mavlink_relay_vm.py --device-host {device_bridge_host} < /dev/null > /tmp/sim_connector_quadcopter_mavlink_relay_launch.log 2>&1 & MAVRELAY_PID=$!;
      python3 $HOME/nepi_engine_ws/nepi_drones/sim_container/scripts/camera_bridge_relay_vm.py --device-host {device_bridge_host} < /dev/null > /tmp/sim_connector_quadcopter_camera_bridge_relay_launch.log 2>&1 & CAMRELAY_PID=$!;
      python3 $HOME/nepi_engine_ws/nepi_drones/sim_container/scripts/ai_targeting_relay_vm.py --device-host {device_bridge_host} < /dev/null > /tmp/sim_connector_quadcopter_ai_targeting_relay_launch.log 2>&1 & AITARGETRELAY_PID=$!;
      python3 $HOME/nepi_engine_ws/nepi_drones/sim_container/scripts/sim_control_relay_vm.py --device-host {device_bridge_host} < /dev/null > /tmp/sim_connector_quadcopter_sim_control_relay_launch.log 2>&1 & SIMCTRLRELAY_PID=$!;
      wait $SITL_PID $GZ_PID $CAM_PID $AI_TARGET_PID $BRIDGE_PID $MAVRELAY_PID $CAMRELAY_PID $AITARGETRELAY_PID $SIMCTRLRELAY_PID
      '
    # Same "Use Existing" override as gazebo_rover's own attach_launch_command
    # -- skips ONLY the gzserver refuse-guard and the `rosrun gazebo_ros
    # gazebo ...` line, on the assumption the operator already knows a
    # gazebo (hopefully with iris_arducopter_cmac.world loaded) is up.
    # Keeps the ArduCopter-port (5760) refuse-guard, camera_rig, SITL, and
    # bridge lines all unchanged -- a second SITL instance colliding on
    # port 5760 is a genuinely different problem attach mode does nothing
    # to solve, so still refuses on that specifically. Same two honest
    # consequences as gazebo_rover's version: stop_command's pgid-kill
    # still can't reach a gzserver this launch never started, and
    # ready_check_command below still catches the wrong-world case as a
    # clean "failed to become ready" rather than a false success.
    # gz_reset_listener guard bracket-escaped here too -- see launch_command's
    # own comment above for why (this attach path is the same kind of
    # long-lived `bash -lc '...'` process, same self-match risk).
    attach_launch_command: >-
      bash -lc '
      source /opt/ros/noetic/setup.bash;
      . $HOME/nepi_engine_ws/nepi_drones/sim_container/scripts/nepi_sim_display_env.sh;
      export GAZEBO_MODEL_PATH=$HOME/nepi_engine_ws/nepi_drones/sim_container/models:$HOME/ardupilot_gazebo/models:$GAZEBO_MODEL_PATH;
      if timeout 1 bash -c "cat < /dev/null > /dev/tcp/127.0.0.1/5760" 2>/dev/null; then echo "REFUSING TO LAUNCH: ArduCopter SITL already appears to be running on this host (port 5760 is taken -- possibly the separate RBX ArduPilot SITL dev flow, see nepi_sitl_dev_env.sh). Only one instance can own the default MAVLink ports at a time. Stop it first." >&2; exit 3; fi;
      pkill -f "[a]i_targeting_controller_ardupilot.py" 2>/dev/null;
      echo $$ > /tmp/sim_connector_quadcopter_launch.pgid;
      rostopic list > /dev/null 2>&1 || {{ nohup roscore < /dev/null > /tmp/sim_connector_quadcopter_roscore_launch.log 2>&1 & until rostopic list > /dev/null 2>&1; do sleep 1; done; }};
      pgrep -f "[g]z_reset_listener.py 9021" > /dev/null || {{ nohup python3 -u $HOME/.local/bin/gz_reset_listener.py 9021 < /dev/null > /tmp/sim_connector_quadcopter_gz_reset_listener_launch.log 2>&1 & disown; }};
      python3 $HOME/nepi_engine_ws/nepi_drones/sim_container/scripts/camera_rig_controller_ardupilot.py < /dev/null > /tmp/sim_connector_quadcopter_camera_rig_launch.log 2>&1 & CAM_PID=$!;
      python3 $HOME/nepi_engine_ws/nepi_drones/sim_container/scripts/ai_targeting_controller_ardupilot.py < /dev/null > /tmp/sim_connector_quadcopter_ai_targeting_launch.log 2>&1 & AI_TARGET_PID=$!;
      sim_vehicle.py -v ArduCopter -f gazebo-iris --out=tcpin:0.0.0.0:5771 --out=tcpin:0.0.0.0:5772 --mavproxy-args="--daemon" < /dev/null > /tmp/sim_connector_quadcopter_sitl_launch.log 2>&1 & SITL_PID=$!;
      python3 $HOME/nepi_engine_ws/nepi_drones/sim_container/bridges/gazebo/sim_connector_bridge_gazebo_quadcopter.py --host {device_bridge_host} --port {device_bridge_port} --mavlink tcp:127.0.0.1:5772 < /dev/null > /tmp/sim_connector_quadcopter_bridge_launch.log 2>&1 & BRIDGE_PID=$!;
      python3 $HOME/nepi_engine_ws/nepi_drones/sim_container/scripts/mavlink_relay_vm.py --device-host {device_bridge_host} < /dev/null > /tmp/sim_connector_quadcopter_mavlink_relay_launch.log 2>&1 & MAVRELAY_PID=$!;
      python3 $HOME/nepi_engine_ws/nepi_drones/sim_container/scripts/camera_bridge_relay_vm.py --device-host {device_bridge_host} < /dev/null > /tmp/sim_connector_quadcopter_camera_bridge_relay_launch.log 2>&1 & CAMRELAY_PID=$!;
      python3 $HOME/nepi_engine_ws/nepi_drones/sim_container/scripts/ai_targeting_relay_vm.py --device-host {device_bridge_host} < /dev/null > /tmp/sim_connector_quadcopter_ai_targeting_relay_launch.log 2>&1 & AITARGETRELAY_PID=$!;
      python3 $HOME/nepi_engine_ws/nepi_drones/sim_container/scripts/sim_control_relay_vm.py --device-host {device_bridge_host} < /dev/null > /tmp/sim_connector_quadcopter_sim_control_relay_launch.log 2>&1 & SIMCTRLRELAY_PID=$!;
      wait $CAM_PID $AI_TARGET_PID $SITL_PID $BRIDGE_PID $MAVRELAY_PID $CAMRELAY_PID $AITARGETRELAY_PID $SIMCTRLRELAY_PID
      '
    # Belt-and-suspenders like gazebo_rover's own stop_command: the pgid kill
    # is the primary mechanism, but sim_vehicle.py is a much more complex
    # process than a plain backgrounded shell job and may not faithfully
    # preserve pgid inheritance for its own descendants (MAVProxy, the
    # ArduCopter binary) -- the explicit pkill patterns are the fallback if
    # it doesn't. "[s]im_vehicle.py" (not "sim_vehicle.py") is deliberate,
    # not a typo -- confirmed the hard way: a plain `pkill -f
    # "sim_vehicle.py -v ArduCopter"` matches THIS SAME bash -lc script's
    # own invocation (its pattern argument is that literal text) and kills
    # itself mid-script, before the later cleanup lines ever run. Unlike
    # the launch_command's ArduCopter guard above, the bracket-class
    # self-match-avoidance idiom genuinely fixes it here: this pattern
    # exists exactly once in this script (the pkill argument itself), not a
    # second time elsewhere the way launch_command's own text repeats it.
    # mavproxy.py needs its own pkill, with -9: confirmed live this was the
    # actual orphan surviving every prior version of this stop_command --
    # sim_vehicle.py's own ArduCopter binary child dies correctly with the
    # pgid kill above, but MAVProxy started with --mavproxy-args="--daemon"
    # (required earlier for a different reason -- see launch_command's own
    # comment on stdin/EOF) double-forks/detaches into its own session
    # (confirmed: PPID becomes 1, immune to the pgid kill), and a plain
    # SIGTERM pkill did not kill it either in that same live test -- only
    # SIGKILL did. Left alive, it keeps holding ports 5771/5772 forever,
    # which is exactly what made the NEXT launch attempt fail in a way that
    # looked like "launching doesn't launch the SITL" (the fresh
    # sim_vehicle.py's own MAVProxy can't bind those ports).
    #
    # gzserver/gzclient need their own explicit, scoped pkill too, same fix
    # and same reasoning as gazebo_rover's own stop_command (confirmed live
    # 2026-09-08 that `rosrun gazebo_ros gazebo` always starts them in a new
    # session, immune to any pgid kill regardless of target) -- scoped by
    # this target's own world file so an unrelated Gazebo survives.
    stop_command: "bash -lc 'f=/tmp/sim_connector_quadcopter_launch.pgid; if [ -f $f ]; then kill -- -$(cat $f) 2>/dev/null; rm -f $f; fi; rm -f /tmp/sim_connector_quadcopter_mavproxy_stdin.fifo; pkill -f \"[s]im_vehicle.py -v ArduCopter\" 2>/dev/null; pkill -9 -f \"[m]avproxy.py\" 2>/dev/null; pkill -f \"[a]rducopter -S\" 2>/dev/null; pkill -f [c]amera_rig_controller_ardupilot.py 2>/dev/null; pkill -f [a]i_targeting_controller_ardupilot.py 2>/dev/null; pkill -f [s]im_connector_bridge_gazebo_quadcopter.py 2>/dev/null; pkill -f [m]avlink_relay_vm.py 2>/dev/null; pkill -f [c]amera_bridge_relay_vm.py 2>/dev/null; pkill -f [a]i_targeting_relay_vm.py 2>/dev/null; pkill -f [g]z_reset_listener.py 2>/dev/null; pkill -f \"[g]zserver .*iris_arducopter_cmac\\.world\" 2>/dev/null; pkill -x gzclient 2>/dev/null; sleep 1; if timeout 1 bash -c \"cat < /dev/null > /dev/tcp/127.0.0.1/5771\" 2>/dev/null; then echo \"WARNING: port 5771 still bound after stop -- a MAVProxy/ArduCopter orphan may have survived\" >&2; fi; true'"
    # Same "prove THIS target's own world is up" bar as gazebo_rover's own
    # ready_check_command -- /camera_rig/camera/image_raw having a real
    # publisher proves camera_rig_controller_ardupilot.py connected to a
    # genuinely-loaded iris_arducopter_cmac.world (that script itself
    # requires finding the iris_demo model in /gazebo/model_states before it
    # publishes anything), not just that some gazebo process exists.
    #
    # The final clause is new: every check above only proves PROCESSES
    # exist, none of them prove ArduCopter SITL itself ever came up --
    # sim_connector_bridge_gazebo_quadcopter.py's own MAVLink connect loop
    # (wait_heartbeat) retries forever on failure, so pgrep on the bridge
    # script stays true even if SITL crashed or never bound its port,
    # reported live as "launching quadcopter doesn't launch the SITL" while
    # this ready-check still reported success. sim_connector_bridge_gazebo_
    # quadcopter.py logs "MAVLink heartbeat from ..." via plain rospy.loginfo
    # (no nepi_sdk.init_node here) the FIRST time wait_heartbeat succeeds --
    # that log line, like every plain-rospy node's, lands in
    # ~/.ros/log/sim_connector_bridge_gazebo_quadcopter.log, not the
    # /tmp/..._bridge_launch.log stdout redirect (confirmed the hard way
    # earlier this session for a different node -- rospy's own logging
    # doesn't reliably follow a shell stdout redirect). Its mere presence in
    # that file is genuine, one-time proof MAVLink was actually alive at
    # some point in this launch, which none of the process-existence checks
    # above can offer.
    ready_check_command: "bash -lc \"source /opt/ros/noetic/setup.bash; pgrep -f 'gzserver.*iris_arducopter_cmac.world' > /dev/null && pgrep -f 'sim_vehicle.py -v ArduCopter' > /dev/null && pgrep -f sim_connector_bridge_gazebo_quadcopter.py > /dev/null && rostopic info /camera_rig/camera/image_raw 2>/dev/null | grep -A1 '^Publishers:' | grep -q ' \\* /' && grep -q 'MAVLink heartbeat' ~/.ros/log/sim_connector_bridge_gazebo_quadcopter.log 2>/dev/null\""
    default_robot_config: flight_robot_4_motor

  # Gazebo, Webots, and MuJoCo below all have full launch paths, verified
  # end-to-end. PyBullet and WPILib HAL Sim (which used to sit here,
  # checkable/installable but never wired up to an actual launch_command)
  # were removed entirely (2026-08-26) rather than left as an honest-but-
  # incomplete placeholder -- judged not useful enough to keep offered as
  # selectable simulators. See their targets' own former comment (git
  # history) or docs/SIMULATOR_AUTO_LAUNCH_PLAN.md for that prior context.
  #
  # (This comment previously also claimed webots_rover/webots_quadcopter had
  # no launch_command -- stale as of the 2026-08-17 RBX-driver work below,
  # which gave both full launch/stop/ready-check commands. Left this note
  # rather than silently erasing the history.)
  webots_rover:
    display_name: "Webots"
    host: "127.0.0.1"
    ssh_user: "suraj"
    ssh_port: 12222
    # nepi_drones existence checked first, same as gazebo_rover -- see that
    # target's own check_installed_command comment for the full "nepi_drones
    # deleted and re-cloned nepi_engine_ws only" scenario this catches.
    check_installed_command: "bash -lc \"test -d $HOME/nepi_engine_ws/nepi_drones/sim_container && command -v webots > /dev/null\""
    # Queries GitHub's own Releases API for whatever is actually latest at
    # install time, rather than hardcoding a version string in this file
    # that would silently go stale. cyberbotics/webots is the upstream
    # project's own repo.
    # Widened (2026-08-26) the same way gazebo_rover's own install_command
    # was: a fresh Ubuntu 20.04 VM cannot be assumed to already have curl/
    # wget on PATH (neither ships in the minimal server image), so the
    # original version's first real command -- calling curl -- could fail
    # outright with "command not found" before ever reaching Webots itself.
    # `apt-get install -y curl wget` is safe to run unconditionally (a no-op
    # if already present, unlike the ROS apt-repo/key steps that genuinely
    # need a skip-if-already-done guard). Also clones nepi_drones itself if
    # missing (2026-08-28) -- see gazebo_rover's own install_command comment
    # for why this is best-effort.
    install_command: >-
      bash -lc '
      set -e;
      if [ ! -d $HOME/nepi_engine_ws/nepi_drones/sim_container ]; then
      mkdir -p $HOME/nepi_engine_ws;
      git clone git@github.com:nepi-engine/nepi_drones.git $HOME/nepi_engine_ws/nepi_drones;
      fi;
      sudo apt-get update -qq;
      sudo apt-get install -y curl wget;
      DEB_URL=$(curl -fsSL https://api.github.com/repos/cyberbotics/webots/releases/latest
      | grep -o "https://[^\"]*_amd64\.deb" | head -1);
      test -n "$DEB_URL";
      wget -q "$DEB_URL" -O /tmp/webots_latest_amd64.deb;
      sudo apt-get update;
      sudo apt-get install -y /tmp/webots_latest_amd64.deb;
      rm -f /tmp/webots_latest_amd64.deb
      '
    # Copy of install_command's own steps, one command per line, for the RUI
    # to show verbatim as a copy-paste fallback -- same convention as
    # gazebo_rover's own manual_fallback_commands.
    manual_fallback_commands: |-
      git clone git@github.com:nepi-engine/nepi_drones.git ~/nepi_engine_ws/nepi_drones
      sudo apt-get update -qq
      sudo apt-get install -y curl wget
      DEB_URL=$(curl -fsSL https://api.github.com/repos/cyberbotics/webots/releases/latest | grep -o 'https://[^"]*_amd64\.deb' | head -1)
      wget -q "$DEB_URL" -O /tmp/webots_latest_amd64.deb
      sudo apt-get update
      sudo apt-get install -y /tmp/webots_latest_amd64.deb
      rm -f /tmp/webots_latest_amd64.deb
    # Launches rbx_rover.wbt, whose Robot node's controller field points at
    # webots_rbx_bridge -- a genuine TCP server (heartbeat on 9041, bridge on
    # 9046, both forwarded through the reverse tunnel) that Webots starts
    # automatically as part of loading the world, matching how gazebo_rover's
    # own sim_heartbeat_listener/sim_bridge_node get their ports. No ROS/
    # roscore dependency at all here (see docs/WEBOTS_RBX_DRIVER_PLAN.md) --
    # unlike gazebo_rover this launch needs nothing but the webots binary.
    #
    # DISPLAY/XAUTHORITY resolution reused verbatim from gazebo_rover's own
    # launch_command: Webots is a real GUI application internally even in
    # --batch mode and a non-interactive ssh session inherits neither.
    #
    # REFUSES TO START if a Webots instance is already running, mirroring
    # gazebo_rover's own refuse-to-launch guard -- same reasoning (a second
    # instance would either collide or confuse things, and there is no
    # equivalent RUI "conflict" recovery flow wired up for Webots yet, so
    # failing loudly here is the only honest option until that's built).
    #
    # `pgrep -x webots` (name-only, not `-f` against the full command line)
    # -- learned the hard way debugging this exact line: an earlier draft
    # used `pgrep -f "webots.*rbx_rover.wbt"` as the guard, but this launch
    # script's OWN later invocation line (`webots --mode=fast --batch
    # .../rbx_rover.wbt`) is part of THIS SAME bash -lc process's argv from
    # the moment it starts -- regardless of which line is currently
    # executing -- so that pattern matched this script's own not-yet-reached
    # invocation line and refused to launch every single time. `-x webots`
    # matches only a process whose NAME is exactly "webots" (this launching
    # shell's own name is "bash"), the identical convention gazebo_rover's
    # own guard already uses for gzserver and explains in its own comment.
    #
    # Session-lifetime process group, same as every other target here: the
    # ssh exec channel's lifetime IS the sim's lifetime (ending in `wait`),
    # not detached with nohup+background-and-forget -- see gazebo_rover's
    # own launch_command comment for why a systemd session teardown would
    # otherwise kill it anyway.
    launch_command: >-
      bash -lc '
      . $HOME/nepi_engine_ws/nepi_drones/sim_container/scripts/nepi_sim_display_env.sh;
      if pgrep -x webots > /dev/null; then echo "REFUSING TO LAUNCH: a Webots instance is already running on this host. Stop the existing simulation first." >&2; exit 3; fi;
      echo $$ > /tmp/sim_connector_webots_launch.pgid;
      webots --mode=fast --batch $HOME/nepi_engine_ws/nepi_drones/sim_container/bridges/webots/worlds/rbx_rover.wbt < /dev/null > /tmp/sim_connector_webots_launch.log 2>&1 & WEBOTS_PID=$!;
      wait $WEBOTS_PID
      '
    # Kills only this launch's own process group (Webots itself, plus the
    # webots_rbx_bridge controller process it spawned as a child) -- same
    # PGID-scoped precision as gazebo_rover's stop_command, for the same
    # reason (never tear down an unrelated instance).
    stop_command: "bash -lc 'f=/tmp/sim_connector_webots_launch.pgid; if [ -f $f ]; then kill -- -$(cat $f) 2>/dev/null; rm -f $f; fi; true'"
    # Process existence alone isn't enough (Webots can be up for a while
    # before its controller script finishes starting) -- the /dev/tcp probe
    # against the heartbeat port is what proves webots_rbx_bridge.py's
    # listener thread is actually accepting connections, mirroring
    # gazebo_rover's own rostopic-based proof that its bridge is really up
    # rather than just "some process exists".
    ready_check_command: "bash -lc \"pgrep -f 'webots.*rbx_rover.wbt' > /dev/null && (exec 3<>/dev/tcp/127.0.0.1/9041) 2>/dev/null && exec 3<&-\""
    # rbx_rover.wbt's only rover model is the same 4-wheel body as
    # generic_rover.world's (see docs/WEBOTS_RBX_DRIVER_PLAN.md item 4) --
    # WHEEL1-4 in the .wbt, not a 2-wheel body.
    default_robot_config: ground_robot_4_wheel
    # This target's own rover world/bridge has no altitude axis or flight
    # controller -- redirect a 4-motor flight profile to webots_quadcopter
    # below instead, a different world/bridge entirely. Mirrors
    # gazebo_rover's own flight_robot_4_motor -> gazebo_quadcopter override
    # exactly -- "Webots" stays the one thing picked in the Simulator
    # selector, no separate "Webots (Quadcopter)" entry to remember.
    launch_target_overrides:
      flight_robot_4_motor: webots_quadcopter

  # Reached only through webots_rover's own launch_target_overrides above --
  # never offered directly in the Simulator selector (hidden_from_selector,
  # same convention gazebo_quadcopter uses). Supervisor-velocity-injected
  # flight (no ArduPilot SITL, no rotor aerodynamics) -- see
  # docs/WEBOTS_QUADCOPTER_DRIVER_PLAN.md for the full design and why this
  # is NOT an attempt to reproduce gazebo_quadcopter's real ArduPilot SITL
  # architecture.
  webots_quadcopter:
    display_name: "Webots (Quadcopter)"
    hidden_from_selector: true
    host: "127.0.0.1"
    ssh_user: "suraj"
    ssh_port: 12222
    # nepi_drones existence checked first, same as gazebo_rover.
    check_installed_command: "bash -lc \"test -d $HOME/nepi_engine_ws/nepi_drones/sim_container && command -v webots > /dev/null\""
    # Same install steps as webots_rover -- it's the same Webots binary,
    # only the world file launched below differs. See webots_rover's own
    # comment for why curl/wget are installed explicitly (2026-08-26) and
    # nepi_drones is cloned if missing (2026-08-28).
    install_command: >-
      bash -lc '
      set -e;
      if [ ! -d $HOME/nepi_engine_ws/nepi_drones/sim_container ]; then
      mkdir -p $HOME/nepi_engine_ws;
      git clone git@github.com:nepi-engine/nepi_drones.git $HOME/nepi_engine_ws/nepi_drones;
      fi;
      sudo apt-get update -qq;
      sudo apt-get install -y curl wget;
      DEB_URL=$(curl -fsSL https://api.github.com/repos/cyberbotics/webots/releases/latest
      | grep -o "https://[^\"]*_amd64\.deb" | head -1);
      test -n "$DEB_URL";
      wget -q "$DEB_URL" -O /tmp/webots_latest_amd64.deb;
      sudo apt-get update;
      sudo apt-get install -y /tmp/webots_latest_amd64.deb;
      rm -f /tmp/webots_latest_amd64.deb
      '
    manual_fallback_commands: |-
      git clone git@github.com:nepi-engine/nepi_drones.git ~/nepi_engine_ws/nepi_drones
      sudo apt-get update -qq
      sudo apt-get install -y curl wget
      DEB_URL=$(curl -fsSL https://api.github.com/repos/cyberbotics/webots/releases/latest | grep -o 'https://[^"]*_amd64\.deb' | head -1)
      wget -q "$DEB_URL" -O /tmp/webots_latest_amd64.deb
      sudo apt-get update
      sudo apt-get install -y /tmp/webots_latest_amd64.deb
      rm -f /tmp/webots_latest_amd64.deb
    # Same launch mechanics as webots_rover -- see that target's own comments
    # for the full reasoning (DISPLAY/XAUTHORITY resolution, the `pgrep -x
    # webots` self-match fix, session-lifetime process group). Only the
    # world file differs.
    launch_command: >-
      bash -lc '
      . $HOME/nepi_engine_ws/nepi_drones/sim_container/scripts/nepi_sim_display_env.sh;
      if pgrep -x webots > /dev/null; then echo "REFUSING TO LAUNCH: a Webots instance is already running on this host. Stop the existing simulation first." >&2; exit 3; fi;
      echo $$ > /tmp/sim_connector_webots_quadcopter_launch.pgid;
      webots --mode=fast --batch $HOME/nepi_engine_ws/nepi_drones/sim_container/bridges/webots/worlds/rbx_quadcopter.wbt < /dev/null > /tmp/sim_connector_webots_quadcopter_launch.log 2>&1 & WEBOTS_PID=$!;
      wait $WEBOTS_PID
      '
    stop_command: "bash -lc 'f=/tmp/sim_connector_webots_quadcopter_launch.pgid; if [ -f $f ]; then kill -- -$(cat $f) 2>/dev/null; rm -f $f; fi; true'"
    # Heartbeat port 9042 (quadcopter), not 9041 (rover) -- see
    # rbx_webots_quadcopter_params.yaml.
    ready_check_command: "bash -lc \"pgrep -f 'webots.*rbx_quadcopter.wbt' > /dev/null && (exec 3<>/dev/tcp/127.0.0.1/9042) 2>/dev/null && exec 3<&-\""
    default_robot_config: flight_robot_4_motor

  mujoco_rover:
    display_name: "MuJoCo"
    host: "127.0.0.1"
    ssh_user: "suraj"
    ssh_port: 12222
    # nepi_drones existence checked first, same as gazebo_rover/webots_rover.
    check_installed_command: "bash -lc \"test -d $HOME/nepi_engine_ws/nepi_drones/sim_container && python3 -c 'import mujoco' > /dev/null 2>&1\""
    # Widened (2026-08-26), same reasoning as gazebo_rover/webots_rover's own
    # install_command: a fresh Ubuntu 20.04 VM has neither pip3
    # (python3-pip isn't part of the base install) nor the system OpenGL/EGL
    # libraries MuJoCo's headless `MUJOCO_GL=egl` renderer links against --
    # confirmed working on THIS dev VM only because Gazebo/Webots had
    # already pulled in mesa/GL packages as their own dependencies, which a
    # MuJoCo-only fresh VM would never get. All of these are safe to
    # apt-get install unconditionally (small, idempotent, no skip-if-present
    # guard needed). Also clones nepi_drones first if missing (2026-08-28).
    install_command: >-
      bash -lc '
      set -e;
      if [ ! -d $HOME/nepi_engine_ws/nepi_drones/sim_container ]; then
      mkdir -p $HOME/nepi_engine_ws;
      git clone git@github.com:nepi-engine/nepi_drones.git $HOME/nepi_engine_ws/nepi_drones;
      fi;
      sudo apt-get update -qq;
      sudo apt-get install -y python3-pip libgl1 libegl1 libopengl0 libosmesa6 libglx0;
      pip3 install --user mujoco
      '
    manual_fallback_commands: |-
      git clone git@github.com:nepi-engine/nepi_drones.git ~/nepi_engine_ws/nepi_drones
      sudo apt-get update -qq
      sudo apt-get install -y python3-pip libgl1 libegl1 libopengl0 libosmesa6 libglx0
      pip3 install --user mujoco
    # Unlike Gazebo/Webots, there is no separate simulator binary --
    # mujoco_rbx_bridge.py IS the simulator (a plain Python process owning
    # both the physics loop and the heartbeat/bridge TCP sockets). It DOES
    # still need a real DISPLAY/XAUTHORITY for its visible
    # mujoco.viewer.launch_passive window, same as gazebo_rover/webots_rover
    # -- same nepi_sim_display_env.sh resolution, sourced below. The camera
    # image relay (a separate offscreen render context) works either way, so
    # a missing display degrades to a warning inside the bridge rather than
    # failing this launch.
    #
    # Refuse-to-launch-if-already-running guard, same reasoning as
    # webots_rover/gazebo_rover (no RUI "conflict" recovery flow exists yet)
    # -- but checked via the heartbeat PORT, not `pgrep -f`. Confirmed the
    # hard way: `pgrep -f mujoco_rbx_bridge.py` matches even when nothing is
    # running, because THIS bash -lc invocation's own argv already contains
    # that literal text (the launch_command string itself names the script
    # it's about to run) -- the exact self-match failure mode webots_rover's
    # own comment warns about for `-f` patterns in general, just triggered a
    # different way here (no `-x`-able binary name to fall back on, since
    # this runs as `python3 <script>`, and `-x python3` would match every
    # unrelated python3 process on the host). A port-liveness check has no
    # such self-match risk.
    #
    # Session-lifetime process group, same as every other target here.
    launch_command: >-
      bash -lc '
      . $HOME/nepi_engine_ws/nepi_drones/sim_container/scripts/nepi_sim_display_env.sh;
      if (exec 3<>/dev/tcp/127.0.0.1/9051) 2>/dev/null; then exec 3<&-; echo "REFUSING TO LAUNCH: a MuJoCo bridge instance is already running on this host (port 9051 is live). Stop the existing simulation first." >&2; exit 3; fi;
      echo $$ > /tmp/sim_connector_mujoco_launch.pgid;
      python3 $HOME/nepi_engine_ws/nepi_drones/sim_container/bridges/mujoco/mujoco_rbx_bridge.py < /dev/null > /tmp/sim_connector_mujoco_launch.log 2>&1 & MUJOCO_PID=$!;
      wait $MUJOCO_PID
      '
    # Kills only this launch's own process group -- same PGID-scoped
    # precision as every other target's stop_command.
    stop_command: "bash -lc 'f=/tmp/sim_connector_mujoco_launch.pgid; if [ -f $f ]; then kill -- -$(cat $f) 2>/dev/null; rm -f $f; fi; true'"
    # Port-liveness only, no `pgrep -f` -- see launch_command's own comment
    # for why a text-pattern process check self-matches here. The /dev/tcp
    # probe against the heartbeat port is real proof mujoco_rbx_bridge.py's
    # listener thread is actually accepting connections.
    ready_check_command: "bash -lc \"(exec 3<>/dev/tcp/127.0.0.1/9051) 2>/dev/null && exec 3<&-\""
    # rbx_rover.xml has 4 independently-actuated wheels (see that model's own
    # comment) -- ground_robot_4_wheel, same profile Gazebo/Webots rovers use.
    default_robot_config: ground_robot_4_wheel

  # PyBullet and WPILib HAL Sim removed (2026-08-26) -- neither had a
  # launch_command wired through this launcher (install-check only), and
  # both were judged not useful enough to keep offered as selectable
  # simulators. Their own bridge scripts under sim_container/bridges/
  # (pybullet/, wpilib/) were deleted entirely 2026-09-14 (not being
  # implemented) -- see docs/MULTI_SIMULATOR_INTEGRATION_PLAN.md Phase 6
  # for WPILib's historical context, if ever needed for reference.
