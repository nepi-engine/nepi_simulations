# Sample/reference file for the shared-storage VM deploy service.
# NOT read by any code in this repo today -- this is the file CONTRACT for
# a teammate's own service to implement, matching what the device already
# does in a different (SSH-based, or the per-request-JSON shared_storage
# mode in os_instance_registry.py/simulator_launcher.py/
# vm_command_watcher.py) transport. This is a THIRD, simpler alternative:
# one persistent YAML file instead of a growing set of per-request JSON
# files, with a single start/stop flag per target instead of an explicit
# action name.
#
# Lives on the shared nepi_storage drive -- the SAME drive nepi setup
# already uses, reachable from Windows as \\<device-ip>\nepi_storage, from
# the VM/laptop and from the device itself over the same SMB share. A real
# deployment would put this at:
#   nepi_storage/databases/nepi_app_sim_connector/vm_deploy_state.yaml
# (one directory, matching this app's other database-tree files -- see
# os_instance_registry.py's OS_INSTANCES_STORAGE_DIR/
# VM_COMMANDS_STORAGE_DIR for the existing convention), but the service
# reading it can use whatever path it's configured with.
#
# Protocol:
#   - Fields under "target" are STATIC CONFIG -- the device (or a human)
#     writes these once per target, mirroring simulator_launch_targets.yaml's
#     own per-target fields exactly (same command text, same meaning) so a
#     service built against this file needs no second file to cross-reference.
#   - "control" is what the device writes on every Deploy/Stop click in the
#     RUI -- "start" is the actual trigger (0 = stopped/idle, 1 = start
#     requested), "install" is a separate one-shot request to run install
#     steps first. "last_updated" changing is what tells the service THIS
#     is a fresh request, not the same file it already handled on a
#     previous poll tick.
#   - "status" is written BACK by the VM-side service, not the device --
#     the device polls (reads) this section to know what's actually
#     happening, the same role status_<request_id>.json plays in the
#     per-request-file protocol.

target:
  # Matches a key in simulator_launch_targets.yaml -- which simulator this
  # file's commands/state refer to.
  target_key: "gazebo_quadcopter"
  display_name: "Gazebo (Quadcopter/ArduCopter SITL)"

  # Substituted into launch_command/attach_launch_command below wherever
  # {device_bridge_host}/{device_bridge_port} appear -- same two values
  # simulator_launch_targets.yaml's own top-level device_bridge_host/
  # device_bridge_port keys provide today.
  device_bridge_host: "nepi"
  device_bridge_port: "9030"

  # Exact same command text/shape as simulator_launch_targets.yaml's own
  # per-target fields -- a `bash -lc '<script>'` string, run locally by the
  # VM-side service (no SSH: it's already running ON that machine). See
  # vm_command_watcher.py's own module docstring for why the wrapper gets
  # stripped before actually executing it (a very long inline `bash -c`
  # string is unreliable; write the body to a temp file and run
  # `bash -l <file>` instead).
  launch_command: >-
    bash -lc '
    echo "put this target's real launch_command here, copied from
    simulator_launch_targets.yaml"
    '
  stop_command: "bash -lc 'echo put this targets real stop_command here'"
  install_command: "bash -lc 'echo put this targets real install_command here'"
  check_installed_command: "bash -lc 'echo put this targets real check_installed_command here'"
  ready_check_command: "bash -lc 'echo put this targets real ready_check_command here'"

# Curated robot chassis/camera dimensions -- same field names and default
# values as generate_model_sdf.py's own ROVER_DEFAULT_DIMENSIONS (the
# quadcopter airframe is a vendored third-party model with no dimensions
# file of its own, so this section only applies to a rover-type target).
# The device pushes this exact shape today via simulator_launcher.py's
# push_dimensions() -> the VM's own generate_model_sdf.py, which renders it
# into model.sdf before a launch -- a service built against this file would
# need to do the same (or shell out to that same script) rather than
# re-deriving the physics itself.
robot:
  wheel_radius_m: 0.1
  wheel_width_m: 0.05
  track_width_m: 0.34
  wheelbase_m: 0.3
  chassis_length_m: 0.4
  chassis_width_m: 0.3
  chassis_height_m: 0.1
  # Overall chassis mass in kg -- affects ground-stick/how easily the rover
  # is pushed around (see generate_model_sdf.py's own comment on this
  # field for the inertia-recompute reasoning). Wheel mass/inertia are
  # separate and unaffected by this value.
  weight_kg: 5.0
  # Shared by both the onboard and chase-cam sensors.
  camera_horizontal_fov_deg: 80.0

# Curated environment/course dimensions -- same field names and default
# values as generate_model_sdf.py's own OBSTACLE_COURSE_DEFAULT_DIMENSIONS.
# _environment_model marks which environment this section actually builds
# (matches the reserved key sim_connector_app_node.py's own
# ENVIRONMENT_MODEL_FIELD_KEY reads/writes on every saved environment
# config) -- "none" here would mean flat ground with no course geometry at
# all, in which case every other field below is simply unused.
environment:
  _environment_model: "obstacle_course"
  course_start_x_m: 2.0
  corridor_width_m: 6.0
  wall_length_m: 22.0
  wall_thickness_m: 0.2
  wall_height_m: 1.0
  baffle_a_x_m: 8.0
  baffle_b_x_m: 14.0
  baffle_gap_m: 0.4
  baffle_thickness_m: 0.2
  ramp_start_x_m: 18.0
  ramp_rise_m: 0.35
  ramp_angle_deg: 9.97
  ramp_plateau_length_m: 1.0

# Written by the DEVICE. The VM-side service only ever READS this section.
control:
  # 0 = stopped/idle, 1 = start requested. Flip 1 -> 0 to request a stop the
  # same way -- same field, not a separate "stop" flag, so there is only
  # ever one thing to poll for "should this be running right now".
  start: 0
  # 1 = also run install_command before starting (or on its own, with
  # start left at 0, to just pre-install without launching). Reset to 0 by
  # the device once status.state moves past "installing" -- the service
  # itself doesn't need to clear this, only react to it.
  install: 0
  # Unix epoch seconds, set by the device on every write to this section.
  # The service's own "is this a new request" check should be
  # last_updated > whatever it last acted on, not a content diff.
  last_updated: 0

# Written by the VM-SIDE SERVICE. The device only ever READS this section
# (the same role status_<request_id>.json plays in the per-request-file
# protocol).
status:
  # idle | installing | starting | running | stopping | failed
  state: "idle"
  # Empty when there is none.
  last_error: ""
  # PID of the running launch process, once state == "running" -- null/0
  # otherwise. Lets the device show something concrete, not just "running".
  pid: 0
  # Unix epoch seconds, updated by the service on every poll tick
  # regardless of whether anything changed -- the device's equivalent of an
  # SSH reachability probe or vm_command_watcher.py's own
  # watcher_heartbeat.json: if this goes stale (much older than the
  # service's own poll interval), the device should treat the VM as
  # unreachable, not merely idle.
  service_last_seen: 0
