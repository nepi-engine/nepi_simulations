# NEPI capability description for this robot config: the same fields as the
# Gazebo service's ROBOT_CONFIGS (see that folder's README.md for the full
# list). Read by sim_connector_app_node.py off the MuJoCo share. These flags
# describe what the robot can do, which is what the RUI renders controls from;
# model.xml is the robot's geometry and motors.

display_name: 4-Wheel Rover
description: >-
  Four-wheel ground robot with differential drive and two cameras. Local
  position control only: no attitude command surface, and no global location
  reference.

# The NEPI driver that controls this robot. rbx_sim makes the MuJoCo service
# run the simulation with its bridge to the device, and the device's Sim
# Connector app start the RBX_SIM driver, so the robot appears in
# Devices -> Robots and can be driven.
nepi_driver: rbx_sim

# How nepi_mujoco_sim.py turns the driver's velocity commands (forward m/s,
# turn rad/s) into wheel speeds. MuJoCo-only: the Gazebo service's copy of
# this file has no such section.
#
# Skid steer: left wheels at (linear - angular * track / 2) / radius, right
# wheels at (linear + angular * track / 2) / radius. effective_track_m is NOT
# the 0.34 m wheel track: a four-wheel skid-steer rover can only turn by
# sliding its wheels sideways, so it turns much slower than plain differential
# drive predicts. With the real track it reached about 25% of the commanded
# turn rate; 4x (1.36 m) measured 97-107% across turning in place, arcs and
# 0.5 m/s driving. Re-measure it if the wheels, mass or friction change.
mujoco_drive:
  type: skid_steer
  wheel_radius_m: 0.1
  effective_track_m: 1.36
  left_actuators:
  - front_left_motor
  - rear_left_motor
  right_actuators:
  - front_right_motor
  - rear_right_motor

wheel_count: 4
motor_count: 4

# Ground robot: commandable in the plane, but no pose or global-location goto.
has_goto_position: true
has_goto_pose: false
has_goto_location: false

has_go_home: true
has_set_home: true
has_go_stop: true

setup_actions:
- RESET
- RETURN_HOME
go_actions: []

# Matches the robot_camera (on the mast) and scene_camera (chase view)
# cameras in model.xml, so both view modes have something real behind them.
has_camera_view_control: true
available_camera_view_modes:
- SCENE_CAMERA
- ROBOT_CAMERA

has_environment_controls: true
